<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
  const closedRoots = new WeakMap();
  const nativeAttachShadow = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function (init) {
    const root = nativeAttachShadow.call(this, init);
    closedRoots.set(this, root);
    return root;
  };
  const settingsListeners = [];
  const settings = {
    enabled: true,
    packs: [
      { name: 'Off', enabled: false, rules: [{ selector: '', censored: 'kept', safe: 'disabled' }] },
      { name: 'Main', enabled: true, rules: [
      { selector: '', censored: 'bad word', safe: 'nice thing' },
      { selector: '.scoped, #also-scoped', censored: 'secret', safe: '[redacted]' },
      { selector: '*', censored: 'foo', safe: '' },
      { selector: ':::invalid', censored: 'kept', safe: 'broken' },
      { selector: '#:Rk9kqlm:, .2col', censored: 'raw', safe: 'escaped' },
      { selector: '', censored: 'tagged', safe: 'tagged [x]' },
      { selector: '', censored: 'alpha', safe: 'beta' },
      { selector: '', censored: 'beta', safe: 'gamma' },
      { selector: '', censored: 'omega', safe: 'final' },
      { selector: '', censored: 'delta', safe: 'omega' },
      { selector: '', censored: 'ab', safe: 'a' },
      ] },
    ],
  };
  window.chrome = {
    storage: {
      local: { get: async (defaults) => ({ ...defaults, ...settings }) },
      onChanged: { addListener: (listener) => settingsListeners.push(listener) },
    },
    dom: { openOrClosedShadowRoot: (element) => closedRoots.get(element) ?? element.shadowRoot },
  };
</script>
<script src="../dist/shadow-hook.js"></script>
<script src="../dist/main.js"></script>
<title>A bad word title</title>
</head>
<body>
<p id="static">A bad word here, kept</p>
<p id="case">BAD WORD, Bad word, bad word</p>
<p id="spaces">bad&nbsp;&nbsp;
   word</p>
<p id="tags">b<b>a</b>d<i></i> <span>wo</span>rd</p>
<p id="invisible">b&#8203;ad w&shy;ord</p>
<p id="blocks"><span>bad</span> <span>word</span></p>
<p id="nested">a fofooo b</p>
<p id="unscoped">secret</p>
<p id="scoped" class="scoped">Secret <b>SECRET</b></p>
<p id="also-scoped">secret</p>
<p id="editable" contenteditable>bad word</p>
<textarea id="textarea">bad word</textarea>
<script id="script">const untouched = 'bad word';</script>
<div id="declarative"><template shadowrootmode="open"><p>bad word</p></template></div>
<div id="open-host" class="scoped"></div>
<div id="dynamic"></div>
<p id="split"></p>
<p id="data">fine</p>
<p id="joined">ba<i>x</i>d word</p>
<p id="raw"><span id=":Rk9kqlm:">raw</span> <span class="2col">raw</span> raw</p>
<p id="tagged">tagged <b>and</b> tagged</p>
<p id="chain">alpha beta</p>
<p id="order">delta omega</p>
<p id="shrink">abb</p>
<pre id="results"></pre>
<script>
  const $ = (id) => document.getElementById(id);

  const openRoot = $('open-host').attachShadow({ mode: 'open' });
  const closedHost = document.createElement('div');
  const closedRoot = closedHost.attachShadow({ mode: 'closed' });
  closedRoot.innerHTML = '<p>bad <b>word</b></p>';

  setTimeout(() => {
    openRoot.innerHTML = '<p>bad word and a secret</p>';
    document.body.append(closedHost);
    $('dynamic').innerHTML = '<section><p>bad word</p></section>';
    $('split').append('ba');
    $('data').firstChild.data = 'now a bad word';
    $('joined').querySelector('i').remove();
  }, 10);
  setTimeout(() => $('split').append('d wo'), 20);
  setTimeout(() => $('split').append('rd'), 30);
  setTimeout(() => {
    $('tagged').querySelector('b').textContent = 'or';
    $('chain').append(' ');
    $('order').append(' ');
    $('shrink').append(' ');
  }, 40);

  setTimeout(() => {
    const actual = {
      title: document.title,
      static: $('static').textContent,
      case: $('case').textContent,
      spaces: $('spaces').textContent,
      tags: $('tags').textContent,
      tagsStructure: $('tags').innerHTML.replace(/(^|>)[^<]*/g, '$1'),
      invisible: $('invisible').textContent,
      blocks: $('blocks').textContent,
      nested: $('nested').textContent,
      unscoped: $('unscoped').textContent,
      scoped: $('scoped').textContent,
      alsoScoped: $('also-scoped').textContent,
      editable: $('editable').textContent,
      textarea: $('textarea').value,
      script: $('script').textContent,
      declarative: $('declarative').shadowRoot.textContent,
      openShadow: openRoot.textContent,
      closedShadow: closedRoot.textContent,
      dynamic: $('dynamic').textContent,
      split: $('split').textContent,
      data: $('data').textContent,
      joined: $('joined').textContent,
      raw: $('raw').textContent,
      tagged: $('tagged').textContent,
      chain: $('chain').textContent,
      order: $('order').textContent,
      shrink: $('shrink').textContent,
    };
    settings.enabled = false;
    settingsListeners.forEach((listener) => listener({}, 'local'));
    setTimeout(() => {
      actual.restored = [$('static'), $('tags'), $('tagged'), $('nested'), openRoot, closedRoot]
        .map((node) => node.textContent)
        .join('|');
      $('results').textContent = btoa(encodeURIComponent(JSON.stringify(actual)));
    }, 50);
  }, 100);
</script>
</body>
</html>
