<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Claude Censor</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <h1>Claude Censor</h1>
    <button id="expand" class="ghost" type="button" title="Open in a tab">Open in tab ↗</button>
    <input id="enabled" class="switch" type="checkbox" role="switch" aria-label="Enable censoring" title="Enable or disable on all tabs">
  </header>

  <main>
    <ol id="packs" aria-label="Rule packs"></ol>

    <div class="toolbar">
      <button id="add-pack" type="button">+ New pack</button>
      <output id="status"></output>
      <button id="import" type="button" title="Add packs from a JSON file">Import</button>
      <button id="export" type="button" title="Save all packs to a JSON file">Export all</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </main>

  <footer>
    Rules run top to bottom across enabled packs, so a later rule sees what earlier ones wrote.
    Drag ⠿ or focus it and press ↑ ↓ to reorder. Drop a rule on another pack to move it there.
  </footer>

  <template id="pack-template">
    <li class="pack" data-item>
      <details name="packs">
        <summary>
          <button class="handle" type="button" draggable="true" aria-label="Reorder pack" title="Drag to reorder">⠿</button>
          <span class="name"></span>
          <span class="count"></span>
          <input class="switch" type="checkbox" role="switch" aria-label="Enable pack" title="Enable or disable this pack">
        </summary>

        <div class="pack-bar">
          <input class="rename" aria-label="Pack name" placeholder="Pack name" autocomplete="off" spellcheck="false">
          <button type="button" data-action="duplicate" title="Add a copy of this pack, switched off">Duplicate</button>
          <button type="button" data-action="export" title="Save this pack to a JSON file">Export</button>
          <button class="danger" type="button" data-action="delete">Delete</button>
        </div>

        <ol class="rules" aria-label="Rules"></ol>

        <form class="new-rule" novalidate>
          <div class="fields"></div>
          <button class="primary">Add rule</button>
        </form>
      </details>
    </li>
  </template>

  <template id="rule-template">
    <li class="rule" data-item>
      <button class="handle" type="button" draggable="true" aria-label="Reorder rule" title="Drag to reorder">⠿</button>
      <form class="fields" novalidate></form>
      <div class="rule-actions">
        <button class="ghost danger" type="button" data-action="delete" aria-label="Delete rule" title="Delete rule">×</button>
        <button class="ghost" type="button" data-action="duplicate" aria-label="Duplicate rule" title="Duplicate rule">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/>
            <path d="M10.5 3v-.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1H3"/>
          </svg>
        </button>
      </div>
    </li>
  </template>

  <template id="fields-template">
    <label>
      <span>Censor</span>
      <input name="censored" placeholder="Text to hide" autocomplete="off" spellcheck="false">
    </label>
    <label>
      <span>Replace with</span>
      <input name="safe" placeholder="Nothing — the text is removed" autocomplete="off" spellcheck="false">
    </label>
    <label>
      <span>Inside</span>
      <input name="selector" placeholder="Everywhere — or a CSS selector" autocomplete="off" spellcheck="false">
    </label>
  </template>
</body>
</html>
